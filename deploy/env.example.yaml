# deploy/env.example.yaml — modele, valeurs factices. Copier vers
# deploy/env.<staging|production>.yaml (ignore par git) et remplacer.
# Lire les valeurs reelles avec scripts/export-service-env.sh.
ENVIRONMENT: "staging"
DATABASE_URL: "postgresql+asyncpg://user:password@host/dbname?ssl=require"
GOOGLE_CLIENT_ID: "000000000000-example.apps.googleusercontent.com"
GOOGLE_CLIENT_SECRET: "example-google-client-secret"
GOOGLE_OAUTH_REDIRECT_URI: "https://staging.example.com/api/v1/auth/google/callback"
GOOGLE_DATA_REDIRECT_URI: "https://staging.example.com/api/v1/connections/google/callback"
GOOGLE_OAUTH_MOCK: "false"
AUDIT_PROBE_MOCK: "false"
ADVISOR_MOCK: "true"
PAGESPEED_API_KEY: ""
ANTHROPIC_API_KEY: ""
FRONTEND_BASE_URL: "https://staging.example.com"
CORS_ORIGINS: '["https://staging.example.com"]'
TOKEN_ENC_KEYS: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
TOKEN_ENC_ACTIVE_VERSION: "1"
APP_SECRET_KEY: "factice-factice-factice-factice-factice-1234"
SENTRY_DSN: ""

# --- Taches planifiees et service worker (lot B) ---
# Meme fichier pour l'API et le worker. L'URL d'un service Cloud Run est
# https://<service>-<numero de projet>.<region>.run.app (connue avant le 1er deploiement).
TASK_QUEUE_BACKEND: "cloud_tasks"
GCP_PROJECT: "guiili"
CLOUD_TASKS_LOCATION: "us-central1"
CLOUD_TASKS_QUEUE_PREFIX: "guiili-staging"
TASKS_INVOKER_SERVICE_ACCOUNT: "guiili-tasks-staging@guiili.iam.gserviceaccount.com"
WORKER_BASE_URL: "https://backend-guiili-staging-worker-000000000000.us-central1.run.app"
INTERNAL_OIDC_AUDIENCE: "https://backend-guiili-staging-worker-000000000000.us-central1.run.app"
# Comptes autorises a appeler le worker : Cloud Tasks, Cloud Scheduler et le compte
# d'execution de l'API. Le script deploie l'API sans --service-account : c'est le compte par
# defaut de Compute Engine, <numero de projet>-compute@developer.gserviceaccount.com
# (voir docs/ops/runbook.md, section 15.2, etape 5). Remplacer le numero factice.
INTERNAL_ALLOWED_INVOKERS: '["guiili-tasks-staging@guiili.iam.gserviceaccount.com","guiili-scheduler-staging@guiili.iam.gserviceaccount.com","000000000000-compute@developer.gserviceaccount.com"]'
# Optionnel, a renseigner apres le 1er deploiement stable : une liste par route, en plus de
# INTERNAL_ALLOWED_INVOKERS (qui s'applique toujours). Absente ou vide = pas de restriction.
# /internal/tick <- compte du Scheduler ; /internal/tasks/run <- compte de Cloud Tasks ;
# /internal/headless/verify <- compte d'execution de l'API. Meme format JSON.
# INTERNAL_SCHEDULER_INVOKERS: '["guiili-scheduler-staging@guiili.iam.gserviceaccount.com"]'
# INTERNAL_TASKS_INVOKERS: '["guiili-tasks-staging@guiili.iam.gserviceaccount.com"]'
# INTERNAL_HEADLESS_INVOKERS: '["000000000000-compute@developer.gserviceaccount.com"]'
